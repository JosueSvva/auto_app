<!DOCTYPE html>

  <link rel="stylesheet" href="style.css">
</head>
<body>

        <p><strong>Placa:</strong> <span id="placa-usuario">...</span></p>
        <p><strong>Modelo:</strong> <span id="modelo-usuario">...</span></p>
        <p><strong>Cor:</strong> <span id="cor-usuario">...</span></p>
        <p><strong>Vaga:</strong> <span id="vaga-usuario">...</span></p>
      </div>
      <button id="btn-sair">Sair</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
